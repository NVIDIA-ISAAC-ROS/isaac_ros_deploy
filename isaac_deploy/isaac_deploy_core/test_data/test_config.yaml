# Test configuration for inference controller
models:
  policy:
    inputs:
    - name: input
      kind: input
      shape: [1, 3]
      type: tensor
    outputs:
    - name: output
      kind: output
      shape: [1, 3]
      type: tensor
    parameters:
      backend: onnx
pipeline:
  inputs:
    policy: [input]
  outputs:
    policy: [output]
  data_flow: {}
